name: ella
description: "A minimalistic but lightning fast gesture based Android launcher written in Flutter."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  android_intent_plus: ^5.0.2
  animated_list_plus: ^0.5.2
  battery_plus: ^6.0.1
  device_apps:
    git:
      url: https://github.com/sumitsharansatsangi/flutter_plugin_device_apps.git
  flutter_colorpicker: ^1.0.3
  google_mlkit_digital_ink_recognition: ^0.14.1
  hive: ^4.0.0-dev.2
  isar_flutter_libs: ^4.0.0-dev.14
  path_provider: ^2.1.3
  http: ^1.2.1
  intl: ^0.20.2
  perfect_freehand: ^2.3.2
  provider: ^6.1.2
  settings_ui: ^2.0.2
  flutter_broadcasts:
    git:
      url: https://github.com/KRTirtho/flutter_broadcasts.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_foreground.png"
